<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariful - Bio Page</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16, #111827);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* মূল বায়ো কার্ড যার চারপাশ দিয়ে লাইভ অ্যানিমেশন হবে */
        .bio-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            
            /* মেইন কার্ডের রানিং বর্ডার অ্যানিমেশন */
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 300% 300%;
            animation: borderAnimation 6s ease infinite;
        }

        @keyframes borderAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* প্রোফাইল ছবি */
        .profile-img-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }
        .profile-img {
            width: 110px !important;
            height: 110px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* সোশ্যাল মিডিয়া বক্স বাটনসমূহ */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(30, 41, 59, 0.7);
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;

            /* প্রতিটি সোশ্যাল বক্সের চারপাশে লাইভ রানিং বর্ডার অ্যানিমেশন */
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(30, 41, 59, 0.8), rgba(30, 41, 59, 0.8)), linear-gradient(120deg, #38bdf8, #ec4899, #8b5cf6, #38bdf8);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 300% 300%;
            animation: borderAnimation 4s linear infinite;
        }

        .btn i {
            font-size: 20px;
        }
        /* ব্র্যান্ড আইকন কালার */
        .btn .fa-x-twitter { color: #ffffff; }
        .btn .fa-telegram { color: #229ED9; }
        .btn .fa-youtube { color: #FF0000; }

        /* হোভার করলে ইফেক্ট */
        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        }
        .btn:hover i {
            transform: scale(1.2);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <!-- প্রোফাইল ছবি -->
        <div class="profile-img-container">
            <img src="https://files.catbox.moe/b7wr12.jpg" alt="Profile" class="profile-img">
        </div>

        <!-- নাম -->
        <h1>ARIFUL-CEO</h1>

        <!-- বায়ো -->
        <p>financial market Legend 💹 Stock Trading \ Forex Training / Binary Trading / crypto trading 💝</p>

        <!-- সোশ্যাল মিডিয়া বক্স -->
        <div class="social-links">
            <a href="https://x.com/ariful172" class="btn" target="_blank">
                <i class="fa-brands fa-x-twitter"></i> X (Twitter)
            </a>
            <a href="https://t.me/xarifulofficial" class="btn" target="_blank">
                <i class="fa-brands fa-telegram"></i> Telegram
            </a>
            <a href="https://youtube.com/@xariful7si=_rhcjk ygSdlvery2" class="btn" target="_blank">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
        </div>
    </div>

</body>
</html>
