<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariful - Bio </title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16, #111827);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        
        /* মূল কার্ডের লাইভ রানিং বর্ডার ও এন্ট্রান্স অ্যানিমেশন */
        .bio-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            padding: 35px 25px;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.95)), linear-gradient(90deg, #38bdf8, #ec4899, #8b5cf6, #38bdf8);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 400% 400%;
            animation: pageEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards, liveBorder 3s linear infinite;
        }

        @keyframes pageEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes liveBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 400% 50%; }
        }

        /* প্রোফাইল ছবি */
        .profile-img-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            animation: fadeInImage 1.5s ease;
        }
        @keyframes fadeInImage {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .profile-img {
            width: 100px !important;
            height: 100px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* সোশ্যাল মিডিয়া বক্স বাটনসমূহ - সমান দূরত্ব ও সাইজ নিশ্চিত করা হয়েছে */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(30, 41, 59, 0.85);
            color: #ffffff;
            height: 50px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14.5px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;

            /* সোশ্যাল বক্সগুলোর লাইভ রানিং বর্ডার অ্যানিমেশন */
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(30, 41, 59, 0.9), rgba(30, 41, 59, 0.9)), linear-gradient(90deg, #38bdf8, #229ED9, #FF0000, #38bdf8);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 400% 400%;
            animation: liveBorder 4s linear infinite;
        }

        .btn i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        /* ব্র্যান্ড আইকন কালার */
        .btn .fa-x-twitter { color: #ffffff; }
        .btn .fa-telegram { color: #229ED9; }
        .btn .fa-facebook { color: #1877F2; }
        .btn .fa-youtube { color: #FF0000; }

        /* হোভার করলে ইফেক্ট */
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }
        .btn:hover i {
            transform: scale(1.15);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <!-- প্রোফাইল ছবি -->
        <div class="profile-img-container">
            <img src="https://files.catbox.moe/b7wrl2.jpg" alt="Profile" class="profile-img">
        </div>

        <!-- নাম -->
        <h1>𝙰𝚁𝙸𝙵𝚄𝙻-𝙲𝙴𝙾</h1>

        <!-- বায়ো -->
        <p>financial market Legend 💹 Stock Trading \ Forex Training / Binary Trading / crypto trading 💝</p>

        <!-- সোশ্যাল মিডিয়া বক্স -->
        <div class="social-links">
            <a href="https://x.com/arifull72" class="btn" target="_blank">
                <i class="fa-brands fa-x-twitter"></i> X Twitter
            </a>
            <a href="https://t.me/xarifulofficial" class="btn" target="_blank">
                <i class="fa-brands fa-telegram"></i> Telegram
            </a>
            <a href="https://www.facebook.com/share/1KXPsuboCt/" class="btn" target="_blank">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
            <a href="https://youtube.com/@xarifull?si=dz9mnUIb8Zi0aJE7" class="btn" target="_blank">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
        </div>
    </div>

</body>
</html>
