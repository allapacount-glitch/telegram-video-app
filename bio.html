<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariful - Bio Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .bio-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1s ease-in-out forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .profile-img-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn:hover {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <!-- আপনার প্রোফাইল ছবির লিংক এখানে দিন -->
        <div class="profile-img-container">
                <img src="https://files.catbox.moe/b7wrl2.jpg" alt="Profile" class="profile-img">
            
        </div>
        
        <!-- আপনার নাম -->
        <h1>ARIFUL-CEO</h1>
        
        <!-- আপনার বায়ো বা পরিচয় -->
        <p>ডিজিটাল ক্রিয়েটর এবং অনলাইন ট্রেডার। আমার সাথে যুক্ত থাকতে নিচে ক্লিক করুন।</p>

        <!-- সোশ্যাল মিডিয়া বাটনগুলো -->
        <div class="social-links">
            <a href="আপনার_ফেসবুক_লিংক" class="btn" target="_blank">ফেসবুক</a>
            <a href="আপনার_টেলিগ্রাম_লিংক" class="btn" target="_blank">টেলিগ্রাম</a>
            <a href="আপনার_হোয়াটসঅ্যাপ_লিংক" class="btn" target="_blank">হোয়াটসঅ্যাপ</a>
        </div>
    </div>

</body>
</html>
