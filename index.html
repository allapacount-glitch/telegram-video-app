<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://pl31426900.profitableratecpmnetwork.com/c0/1c/36/c01c3676384da5f3145687e4300e5055f2.js" data-cfasync="false"></script>
    <script src="https://pl31426998.profitableratecpmnetwork.com/16/30/4d/16304d490aba50e69dd23501a07794.js" data-cfasync="false"></script>

    <style>
        /* টিকটক স্টাইল ফুল স্ক্রিন স্ন্যাপ ফিড */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; /* মেইন পেজ স্ক্রল বন্ধ রেখে ফিড স্ক্রল চালু রাখা */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* টিকটক স্টাইল ফুলস্ক্রিন ফিড কন্টেইনার */
        #videoFeed {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* এক ভিডিও থেকে অন্য ভিডিওতে স্ন্যাপ করবে */
            scrollbar-width: none; /* ফায়ারফক্স স্ক্রোলবার হাইড */
        }

        #videoFeed::-webkit-scrollbar {
            display: none; /* ক্রোম/সাফারি স্ক্রোলবার হাইড */
        }

        /* প্রতিটি ভিডিও সেকশন পুরো স্ক্রিন জুড়ে থাকবে */
        .video-container {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* থাম্বনেল বা ভিডিওর স্টাইল (9:16 টিকটক ফিট) */
        .media-box {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-box img, .media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* পুরো স্ক্রিন লম্বালম্বিভাবে পূরণ করবে */
            display: block;
        }

        /* প্লে বাটন ডিজাইন */
        .play-btn {
            position: absolute;
            width: 75px;
            height: 75px;
            background: rgba(229, 9, 20, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.6);
            z-index: 5;
            transition: transform 0.2s ease;
        }

        .play-btn::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 24px solid #ffffff;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            margin-left: 5px;
        }

        /* ভিডিওর ওপর টাইটেল ও ওভারলে */
        .video-overlay {
            position: absolute;
            bottom: 30px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* হেডার লোগো বা নোটিশ (ভাসমান) */
        .floating-header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(229, 9, 20, 0.85);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="floating-header">🔥 এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</div>

    <div id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // আপনার অ্যাডস্টারার ডাইরেক্ট লিংক (পপ-আপের জন্য)
        const ADSTERRA_DIRECT_LINK = "https://www.highrevenuegate.com/your-direct-link-id";

        // ভিডিওর তালিকা
        const videoList = [
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: "স্কুল গিয়ে টয়লেটে প্রেমিক প্রেমিকার ভিডিও এখুনি দেখে নাও 💋",
                thumbnail: "https://files.catbox.moe/ai3i9a.jpg",
                videoUrl: "https://files.catbox.moe/nu40k0.mp4"
            }
        ];

        const feedContainer = document.getElementById('videoFeed');

        // ভিডিও কার্ডগুলো জেনারেট করা
        videoList.forEach((video, index) => {
            const container = document.createElement('div');
            container.className = 'video-container';

            container.innerHTML = `
                <div class="media-box" id="media-box-${index}" onclick="handlePlay(${index})">
                    <img src="${video.thumbnail}" alt="${video.title}">
                    <div class="play-btn"></div>
                </div>
                <div class="video-overlay">
                    <h3 class="video-title">${video.title}</h3>
                </div>
            `;

            feedContainer.appendChild(container);
        });

        // ক্লিক করলে অ্যাড ওপেন হবে এবং ভিডিও চালু হবে
        function handlePlay(index) {
            // অ্যাডস্টারার পপ-আপ বা ডাইরেক্ট লিংক ট্রিগার
            if (ADSTERRA_DIRECT_LINK && ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            const box = document.getElementById(`media-box-${index}`);
            box.onclick = null; // বারবার ক্লিক বন্ধ করা

            box.innerHTML = `
                <video id="vid-${index}" src="${videoList[index].videoUrl}" controls autoplay playsinline webkit-playsinline x5-playsinline></video>
            `;
        }

        // টিকটক স্টাইল অটো পজ (স্ক্রল করলে ওপরের ভিডিও বন্ধ হয়ে যাবে)
        const observerOptions = {
            root: feedContainer,
            threshold: 0.6 // যখন ভিডিওটির ৬০% স্ক্রিনে দৃশ্যমান হবে
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const videoElement = entry.target.querySelector('video');
                if (videoElement) {
                    if (!entry.isIntersecting) {
                        videoElement.pause(); // স্ক্রিন থেকে চলে গেলে ভিডিও পজ হবে
                    }
                }
            });
        }, observerOptions);

        // সব কন্টেইনার মনিটর করা
        setTimeout(() => {
            document.querySelectorAll('.video-container').forEach(container => {
                observer.observe(container);
            });
        }, 500);
    </script>

    <script>
        // স্ক্রিন ব্লার প্রটেকশন
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                document.body.style.filter = "blur(25px)";
            } else {
                document.body.style.filter = "none";
            }
        });

        window.addEventListener("blur", function() {
            document.body.style.filter = "blur(25px)";
        });

        window.addEventListener("focus", function() {
            document.body.style.filter = "none";
        });
    </script>
</body>
</html>
