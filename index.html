<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Video Player</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            color: #38bdf8;
        }
        .video-card {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }
        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(56, 189, 248, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transition: transform 0.2s, background 0.2s;
        }
        .play-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .video-desc {
            font-size: 13px;
            color: #94a3b8;
        }
        .player-container {
            display: none;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1> Viral Video Player 🎬</h1>
    </div>

    <!-- Video Card with Play Trigger -->
    <div class="video-card" id="videoCard">
        <div class="thumbnail-container">
            <img src="https://picsum.photos/600/340" alt="Video Thumbnail">
            <button class="play-btn" onclick="playVideoWithAd()">▶</button>
        </div>
        <div class="video-info">
            <div class="video-title">🔥 এক্সক্লুসিভ ভাইরাল ভিডিও ক্লিপ</div>
            <div class="video-desc">ভিডিওটি প্লে করতে উপরের প্লে বাটনে চাপ দিন।</div>
        </div>
    </div>

    <!-- Actual Video Player -->
    <div class="player-container" id="playerContainer">
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
    </div>

    <script>
        // Telegram WebApp Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Adsterra Direct Link
        const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/f2j8mtn8qv?key=63fa3c81a5f4463c442f67a0175b62a4";
        
        // Demo Video URL (Change this with your video link)
        const SAMPLE_VIDEO_URL = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";

        function playVideoWithAd() {
            // 1. Open Adsterra Direct Link in new tab/popup
            if (ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            // 2. Hide Card and Show Video Player
            document.getElementById('videoCard').style.display = 'none';
            const playerContainer = document.getElementById('playerContainer');
            const videoIframe = document.getElementById('videoIframe');
            
            videoIframe.src = SAMPLE_VIDEO_URL;
            playerContainer.style.display = 'block';
        }
    </script>
</body>
</html>
