<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Video Hub</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://pl31426899.profitableratecpmnetwork.com/c0/1c/36/c01c3676384da5145687e4306e5055f2.js"></script>
<script src="https://pl31426900.profitableratecpmnetwork.com/16/30/4d/16304ded490aba50e69dd23501a07794.js"></script>
    
    <style>
        /* মূল ব্যাকগ্রাউন্ড - প্রিমিয়াম ডার্ক মুভি থিম */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* সিনেমাটিক হেডার */
        .header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: linear-gradient(180deg, #e50914 0%, #161b22 100%);
            padding: 18px 10px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .header p {
            font-size: 13px;
            color: #ffcc00;
            margin: 6px 0 0 0;
            font-weight: 700;
        }

        /* ভিডিও কন্টেইনার */
        #videoFeed {
            width: 100%;
            max-width: 500px;
        }

        /* প্রিমিয়াম ভিডিও কার্ড */
        .video-card {
            background: #161b22;
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
            border: 1px solid #30363d;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* সুন্দর প্লে বোতাম */
        .play-btn {
            position: absolute;
            width: 55px;
            height: 55px;
            background: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
            transition: transform 0.2s;
        }

        .play-btn::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid #ffffff;
            margin-left: 4px;
        }

        .video-info {
            padding: 12px 15px;
            background: #161b22;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0;
            line-height: 1.4;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</h1>
        <p>⚠️ ডিলিট হওয়ার আগে জলদি দেখুন! আর কোথাও পাবেন না 🔥</p>
    </div>

    <div id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // অ্যাডস্টারার ডাইরেক্ট লিংক (আপনার লিংক)
        const ADSTERRA_DIRECT_LINK = "https://www.highrevenuegate.com/your-direct-link-id"; 

        // আপনার ভিডিও তালিকা
        const videoList = [
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: "🎬 ট্রেন্ডিং ভিডিও ক্লিপ ২",
                thumbnail: "https://picsum.photos/600/340?random=2",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            }
        ];

        const feedContainer = document.getElementById('videoFeed');

        videoList.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';

            card.innerHTML = `
                <div class="thumbnail-container" id="thumb-box-${index}" onclick="handlePlay(${index})">
                    <img src="${video.thumbnail}" alt="${video.title}">
                    <div class="play-btn"></div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                </div>
            `;

            feedContainer.appendChild(card);
        });

        // ক্লিক করলে অ্যাড ওপেন হবে এবং ভিডিও চালু হবে
        function handlePlay(index) {
            // ১. অ্যাডস্টারার ডাইরেক্ট লিংক নতুন ট্যাবে খোলা
            if (ADSTERRA_DIRECT_LINK && ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            // ২. থাম্বনেইল সরিয়ে রিয়েল ভিডিও প্লেয়ার বসানো
            const box = document.getElementById(`thumb-box-${index}`);
            box.onclick = null; // বারবার ক্লিক বন্ধ করা

            box.innerHTML = `
                <video src="${videoList[index].videoUrl}" controls autoplay playsinline></video>
            `;
        }
    </script>
</body>
</html>
