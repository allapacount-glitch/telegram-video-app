<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Video Hub</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            color: #38bdf8;
        }
        .video-feed {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .video-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }
        .thumbnail-container img, .thumbnail-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(56, 189, 248, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transition: transform 0.2s;
        }
        .play-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1> Viral Video Hub 🎬</h1>
    </div>

    <!-- Video Feed List -->
    <div class="video-feed" id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Adsterra Direct Link
        const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/f2j8mtn8qv?key=63fa3c81a5f4463c442f67a0175b62a4";

        // ==========================================
        // 🎬 ভিডিও লিস্ট (এখানে নতুন ভিডিও যোগ করবেন)
        // ==========================================
        const videoList = [
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: "🫦",
                thumbnail: "",
                videoUrl: ""
            }
        ];

        // Render Videos Automatically
        const feedContainer = document.getElementById('videoFeed');

        videoList.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail-container" id="container-${index}">
                    <img src="${video.thumbnail}" alt="Thumbnail">
                    <button class="play-btn" onclick="playVideo(${index})">▶</button>
                </div>
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                </div>
            `;
            feedContainer.appendChild(card);
        });

        function playVideo(index) {
            // Open Adsterra Ad
            if (ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            // Replace Thumbnail with Video
            const container = document.getElementById(`container-${index}`);
            const videoData = videoList[index];

            container.innerHTML = `
                <video controls autoplay style="width:100%; height:100%;">
                    <source src="${videoData.videoUrl}" type="video/mp4">
                    Your browser does not support video.
                </video>
            `;
        }
    </script>
</body>
</html>
