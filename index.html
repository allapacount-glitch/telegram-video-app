<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsterra Weblinks (Head Section) -->
    <script src="https://pl31426899.profitableratecpmnetwork.com/c0/1c/36/c01c3676384da5145687e4306e5055f2.js" data-cfasync="false"></script>
    <script src="https://pl31426900.profitableratecpmnetwork.com/16/30/4d/16304ded490aba50e69dd23501a07794.js" data-cfasync="false"></script>

    <style>
        /* প্রিমিয়াম টিকটক স্টাইল ফুল স্ক্রিন স্ন্যাপ ফিড */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #videoFeed {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        #videoFeed::-webkit-scrollbar {
            display: none;
        }

        .video-container {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-box {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-box img, .media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* প্রিমিয়াম গ্লাস ইফেক্ট প্লে বাটন */
        .play-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(229, 9, 20, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(229, 9, 20, 0.5);
            z-index: 5;
            transition: transform 0.25s ease, background 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .media-box:hover .play-btn {
            transform: scale(1.08);
            background: rgba(229, 9, 20, 0.95);
        }

        .play-btn::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 26px solid #ffffff;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 6px;
        }

        /* প্রিমিয়াম গ্লাসমরফিজম ওভারলে */
        .video-overlay {
            position: absolute;
            bottom: 35px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.65);
            padding: 16px 18px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0;
            line-height: 1.4;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* প্রফেশনাল হেডার ব্যাজ */
        .floating-header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(229, 9, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="floating-header">🔥 এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</div>

    <div id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // আপনার প্রদান করা দুটি অ্যাডস্টারার ডাইরেক্ট লিংক
        const DIRECT_LINKS = [
            "https://www.profitableratecpmnetwork.com/f2j8mtn8qv?key=63fa3c81a5f4463c442f67a0175b62a4",
            "https://www.profitableratecpmnetwork.com/fjgruvdg6u?key=9f72011975068f62cee154b648c9e44a"
        ];

        // ভিডিওর তালিকা
        const videoList = [
            
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "",
                videoUrl: "https://files.catbox.moe/d260g8.mp4"
            },
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: "স্কুল গিয়ে টয়লেটে প্রেমিক প্রেমিকার ভিডিও এখুনি দেখে নাও 💋",
                thumbnail: "https://files.catbox.moe/ai3i9a.jpg",
                videoUrl: "https://files.catbox.moe/nu40k0.mp4"
            }
        ];

        const feedContainer = document.getElementById('videoFeed');

        // ভিডিও কার্ড জেনারেটর
        videoList.forEach((video, index) => {
            const container = document.createElement('div');
            container.className = 'video-container';

            container.innerHTML = `
                <div class="media-box" id="media-box-${index}" onclick="handlePlay(${index})">
                    <img src="${video.thumbnail}" alt="${video.title}">
                    <div class="play-btn"></div>
                </div>
                <div class="video-overlay">
                    <h3 class="video-title">${video.title}</h3>
                </div>
            `;

            feedContainer.appendChild(container);
        });

        // ক্লিক করলে দুটি ডাইরেক্ট লিংক থেকে অল্টারনেট বা একসাথে ট্রিগার হবে এবং ভিডিও চালু হবে
        function handlePlay(index) {
            // ইউজার ক্লিকের মাধ্যমে ডাইরেক্ট লিংক ওপেন করা
            DIRECT_LINKS.forEach(link => {
                if (link) {
                    window.open(link, '_blank');
                }
            });

            const box = document.getElementById(`media-box-${index}`);
            box.onclick = null; // ডাবল ক্লিক রোধ করতে

            box.innerHTML = `
                <video id="vid-${index}" src="${videoList[index].videoUrl}" controls autoplay playsinline webkit-playsinline x5-playsinline></video>
            `;
        }

        // টিকটক স্টাইল অটো পজ (স্ক্রল করলে ওপরের ভিডিও বন্ধ হবে)
        const observerOptions = {
            root: feedContainer,
            threshold: 0.6
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const videoElement = entry.target.querySelector('video');
                if (videoElement) {
                    if (!entry.isIntersecting) {
                        videoElement.pause();
                    }
                }
            });
        }, observerOptions);

        setTimeout(() => {
            document.querySelectorAll('.video-container').forEach(container => {
                observer.observe(container);
            });
        }, 500);
    </script>

    <script>
        // স্ক্রিন ব্লার প্রটেকশন
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                document.body.style.filter = "blur(25px)";
            } else {
                document.body.style.filter = "none";
            }
        });

        window.addEventListener("blur", function() {
            document.body.style.filter = "blur(25px)";
        });

        window.addEventListener("focus", function() {
            document.body.style.filter = "none";
        });
    </script>
</body>
</html>
