<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Video Hub</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <style>
        /* মূল ব্যাকগ্রাউন্ড - প্রিমিয়াম ডার্ক থিম */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* সিনেমাটিক রেড অ্যান্ড ব্ল্যাক হেডার */
        .header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: linear-gradient(180deg, #e50914 0%, #11141d 100%);
            padding: 18px 10px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 13px;
            color: #ffcc00; /* উজ্জ্বল গোল্ডেন ওয়ার্নিং */
            margin: 6px 0 0 0;
            font-weight: 700;
        }

        /* ভিডিও ফিড লিস্ট */
        #videoFeed, .video-feed {
            width: 100%;
            max-width: 500px;
        }

        /* সুন্দর প্রিমিয়াম কার্ড স্টাইল */
        .video-card {
            background: #151922;
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
            border: 1px solid #232936;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-container img, 
        .thumbnail-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 12px 15px;
            background: #151922;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            margin: 0;
            line-height: 1.4;
        }
        </style>
    
 
</head>
<body>

    <div class="header">
        <h1> Viral Video Hub 🎬</h1>
    </div>

    <!-- Video Feed List -->
    <div class="video-feed" id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Adsterra Direct Link
        const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/f2j8mtn8qv?key=63fa3c81a5f4463c442f67a0175b62a4";

        // ==========================================
        // 🎬 ভিডিও লিস্ট (এখানে নতুন ভিডিও যোগ করবেন)
        // ==========================================
        const videoList = [
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: "🫦",
                thumbnail: "",
                videoUrl: ""
            }
        ];

        // Render Videos Automatically
        const feedContainer = document.getElementById('videoFeed');

        videoList.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail-container" id="container-${index}">
                    <img src="${video.thumbnail}" alt="Thumbnail">
                    <button class="play-btn" onclick="playVideo(${index})">▶</button>
                </div>
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                </div>
            `;
            feedContainer.appendChild(card);
        });

        function playVideo(index) {
            // Open Adsterra Ad
            if (ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            // Replace Thumbnail with Video
            const container = document.getElementById(`container-${index}`);
            const videoData = videoList[index];

            container.innerHTML = `
                <video controls autoplay style="width:100%; height:100%;">
                    <source src="${videoData.videoUrl}" type="video/mp4">
                    Your browser does not support video.
                </video>
            `;
        }
    </script>
</body>
</html>
