<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Video Hub</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* প্রফেশনাল ডার্ক মুভি ওয়েবসাইট ব্যাকগ্রাউন্ড */
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background: #090a0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* সিনেমাটিক গ্লাস-মর্ফিজম হেডার */
        .app-header {
            background: linear-gradient(180deg, rgba(229, 9, 20, 0.9) 0%, rgba(15, 15, 20, 0.95) 100%);
            padding: 22px 15px 18px 15px;
            text-align: center;
            border-bottom: 2px solid rgba(229, 9, 20, 0.5);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        /* প্রধান আকর্ষণীয় শিরোনাম */
        .app-header h1 {
            font-size: 21px;
            font-weight: 800;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* অফার বা ওয়ার্নিং টেক্সট */
        .app-header p {
            font-size: 13px;
            margin: 8px 0 0 0;
            color: #ffcc00;
            font-weight: 700;
            letter-spacing: 0.3px;
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.8; text-shadow: 0 0 5px rgba(255, 204, 0, 0.4); }
            100% { opacity: 1; text-shadow: 0 0 15px rgba(255, 204, 0, 0.9); }
        }

        /* ভিডিও কার্ড লিস্ট কন্টেইনার */
        .feed-container {
            max-width: 550px;
            margin: 15px auto;
            padding: 0 12px;
        }

        /* সিনেমাটিক মুভি কার্ড স্টাইল */
        .video-card {
            background: #14151f;
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease;
        }

        .video-card:active {
            transform: scale(0.98);
        }

        /* ভিডিও ও থাম্বনেইল কন্টেইনার */
        .thumbnail-container {
            position: relative;
            width: 100%;
            background: #000000;
        }

        .thumbnail-container img, 
        .thumbnail-container video {
            width: 100%;
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            object-fit: cover;
        }

        /* ভিডিও টাইটেল সেকশন */
        .video-info {
            padding: 14px 16px;
            background: linear-gradient(180deg, #14151f 0%, #0d0e14 100%);
        }

        .video-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.4;
            margin: 0;
        }
    </style>
    
</head>
<body>

    <div class="header">
        <h1> Viral Video Hub 🎬</h1>
    </div>

    <!-- Video Feed List -->
    <div class="video-feed" id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Adsterra Direct Link
        const ADSTERRA_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/f2j8mtn8qv?key=63fa3c81a5f4463c442f67a0175b62a4";

        // ==========================================
        // 🎬 ভিডিও লিস্ট (এখানে নতুন ভিডিও যোগ করবেন)
        // ==========================================
        const videoList = [
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: "🫦",
                thumbnail: "",
                videoUrl: ""
            }
        ];

        // Render Videos Automatically
        const feedContainer = document.getElementById('videoFeed');

        videoList.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail-container" id="container-${index}">
                    <img src="${video.thumbnail}" alt="Thumbnail">
                    <button class="play-btn" onclick="playVideo(${index})">▶</button>
                </div>
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                </div>
            `;
            feedContainer.appendChild(card);
        });

        function playVideo(index) {
            // Open Adsterra Ad
            if (ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            // Replace Thumbnail with Video
            const container = document.getElementById(`container-${index}`);
            const videoData = videoList[index];

            container.innerHTML = `
                <video controls autoplay style="width:100%; height:100%;">
                    <source src="${videoData.videoUrl}" type="video/mp4">
                    Your browser does not support video.
                </video>
            `;
        }
    </script>
</body>
</html>
