<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://pl31426900.profitableratecpmnetwork.com/c0/1c/36/c01c3676384da5f3145687e4300e5055f2.js"></script>
    <script src="https://pl31426998.profitableratecpmnetwork.com/16/30/4d/16304d490aba50e69dd23501a07794.js"></script>

    <style>
        /* টিকটক স্টাইল ফুল স্ক্রিন লেআউট */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* হেডার ডিজাইন */
        .header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: linear-gradient(180deg, #e50914 0%, #161b22 100%);
            padding: 14px 10px;
            margin-bottom: 10px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.3);
            box-sizing: border-box;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .header p {
            font-size: 12px;
            color: #ffcc00;
            margin: 5px 0 0;
            font-weight: 700;
        }

        /* ভিডিও ফিড কন্টেইনার */
        #videoFeed {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 30px;
        }

        /* টিকটক স্টাইল ভিডিও কার্ড (লম্বা 9:16 রেশিও) */
        .video-card {
            background: #121212;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 9 / 16; /* টিকটকের মতো লম্বা স্ক্রিন */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* প্লে বাটন ডিজাইন */
        .play-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.6);
            transition: transform 0.2s ease;
        }

        .thumbnail-container:hover .play-btn {
            transform: scale(1.1);
        }

        .play-btn::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 22px solid #ffffff;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            margin-left: 4px;
        }

        .video-info {
            padding: 12px 15px;
            background: #161b22;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0;
            line-height: 1.4;
        }

        /* ভিডিও প্লেয়ার স্টাইল (টিকটকের মতো সম্পূর্ণ ফিট) */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* লম্বা স্ক্রিন জুড়ে দেখাবে */
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 এক্সক্লুসিভ প্রাইভেট ভিডিও HUB</h1>
        <p>⚠️ ডিলিট হওয়ার আগে জলদি দেখুন! আর কোথাও পাবেন না 🔥</p>
    </div>

    <div id="videoFeed"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // অ্যাডস্টারার ডাইরেক্ট লিংক
        const ADSTERRA_DIRECT_LINK = "https://www.highrevenuegate.com/your-direct-link-id";

        // আপনার ভিডিও তালিকা
        const videoList = [
            {
                title: "🔥 এক্সক্লুসিভ টিকটক ভাইরাল ভিডিও ১",
                thumbnail: "https://files.catbox.moe/gxt4cr.png",
                videoUrl: "https://files.catbox.moe/e1kn68.mp4"
            },
            {
                title: " স্কুল গিয়ে টয়লেটে প্রেমিক প্রেমিকার ভিডিও এখুনি দেখে নাও 💋",
                thumbnail: "https://files.catbox.moe/ai3i9a.jpg",
                videoUrl: "https://files.catbox.moe/nu40k0.mp4"
            }
        ];

        const feedContainer = document.getElementById('videoFeed');

        videoList.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';

            card.innerHTML = `
                <div class="thumbnail-container" id="thumb-box-${index}" onclick="handlePlay(${index})">
                    <img src="${video.thumbnail}" alt="${video.title}">
                    <div class="play-btn"></div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                </div>
            `;

            feedContainer.appendChild(card);
        });

        // ক্লিক করলে অ্যাড ওপেন হবে এবং ভিডিও চালু হবে
        function handlePlay(index) {
            // ১. অ্যাডস্টারার ডাইরেক্ট লিংকে নতুন ট্যাবে খোলা
            if (ADSTERRA_DIRECT_LINK && ADSTERRA_DIRECT_LINK !== "") {
                window.open(ADSTERRA_DIRECT_LINK, '_blank');
            }

            // ২. থাম্বনেল সরিয়ে টিকটক স্টাইল লম্বা ভিডিও প্লেয়ার বসানো
            const box = document.getElementById(`thumb-box-${index}`);
            box.onclick = null; // বারবার ক্লিক বন্ধ করা

            box.innerHTML = `
                <video src="${videoList[index].videoUrl}" controls autoplay playsinline webkit-playsinline x5-playsinline></video>
            `;
        }
    </script>

    <script>
        // স্ক্রিন ব্লার প্রটেকশন কোড
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                document.body.style.filter = "blur(25px)";
            } else {
                document.body.style.filter = "none";
            }
        });

        window.addEventListener("blur", function() {
            document.body.style.filter = "blur(25px)";
        });

        window.addEventListener("focus", function() {
            document.body.style.filter = "none";
        });
    </script>
</body>
</html>
